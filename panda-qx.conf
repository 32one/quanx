[rewrite]
# PandaTV CDN Origin 头注入 - 三条规则覆盖所有域名
^https?://[^/]*pandatv\.co\.kr/.* header-replace Origin: https://www.pandalive.co.kr
^https?://[^/]*pandalive\.co\.kr/.* header-replace Origin: https://www.pandalive.co.kr
^https?://[^/]*live-video\.net/.* header-replace Origin: https://www.pandalive.co.kr

[mitm]
hostname = %APPEND% pandatv.co.kr *.pandatv.co.kr cdn-live.pandatv.co.kr cdn-live-01.pandatv.co.kr cdn-live-02.pandatv.co.kr cdn-live-03.pandatv.co.kr pandalive.co.kr *.pandalive.co.kr live-video.net *.live-video.net